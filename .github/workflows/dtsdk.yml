name: go-dtalgorand-sdk

# CI for the dtalgorand branch of go-dtalgorand-sdk. Pushing a v<version> tag
# (v2.14.0-dt.4.0.0.1) on dtalgorand tests it and creates its GitHub release;
# the Go module proxy serves the tag itself. See "Releasing" in DTALGOSDK.md.
on:
  push:
    branches: [dtalgorand]
    tags: ['v*-dt.*']
  pull_request:
    branches: [dtalgorand]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dtsdk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The algorand-sdk-testing commit the tests run against, pinned so that new
  # upstream scenarios can't break the fork's CI. Move it when merging an
  # upstream release.
  SDK_TESTING_COMMIT: 04eea85

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on dtalgorand
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin dtalgorand
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME is not on dtalgorand"
            exit 1
          }

      - name: Check the fork's changes to upstream code
        run: ./scripts/dt-guard.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fetch the SDK test features
        run: |
          git clone --quiet https://github.com/algorand/algorand-sdk-testing test-harness
          git -C test-harness archive "$SDK_TESTING_COMMIT" features | tar -x -C test/

      - name: Unit and cucumber unit tests
        run: make unit

      - name: Lint
        run: make lint

  release:
    name: GitHub release
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::The $GITHUB_REF_NAME release already exists"
            exit 0
          fi
          {
            echo "Use it in place of go-algorand-sdk with \`go mod edit -replace=github.com/algorand/go-algorand-sdk/v2=github.com/$GITHUB_REPOSITORY/v2@$GITHUB_REF_NAME\`. The changes from go-algorand-sdk are in [DTALGOSDK.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/DTALGOSDK.md)."
            prev=$(git describe --tags --abbrev=0 --match 'v*-dt.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo
              echo "## Changes since $prev"
              echo
              git log --first-parent --format='- %s (%h)' "$prev..$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --prerelease=false \
            --title "go-dtalgorand-sdk ${GITHUB_REF_NAME#v}" --notes-file notes.md
